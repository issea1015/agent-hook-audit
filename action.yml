name: Agent hook audit
description: Audit Claude Code hook configurations (settings.json, plugin hooks.json) and the scripts they run. Fails on download-and-run, obfuscation, secret access and network calls.
branding:
  icon: shield
  color: green
inputs:
  path:
    description: Folder to scan (default the repository root)
    default: "."
  fail-on:
    description: "Lowest severity that fails the job: high, medium or low (default: the policy file's fail_on, else high)"
    default: ""
  sarif-file:
    description: Also write findings as SARIF 2.1.0 to this path (upload it with github/codeql-action/upload-sarif)
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
      run: python3 "$GITHUB_ACTION_PATH/run_action.py"
